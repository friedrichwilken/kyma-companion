name: Doc Indexer Tests

# The unit tests live in pull-unit-tests-doc-indexer.yaml. They need no secrets, so they
# run on `pull_request` and never execute PR code in the context of the base repository.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - "main"
      - "release-**"
    paths:
      - "doc_indexer/**"
      - ".github/workflows/pull-tests-doc-indexer.yaml"

permissions: read-all

jobs:
  integration-tests:
    name: Tests (integration)
    runs-on: ubuntu-latest
    # Keep this a literal value (no expression), so the approval gate can never resolve
    # to an empty environment for a job that checks out PR code.
    environment: e2e
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Safe: the `environment: e2e` gate above requires codeowner approval before
          # this job runs, so secrets are never exposed to unreviewed fork code.
          allow-unsafe-pr-checkout: true

      - name: Extract Python version
        working-directory: ./doc_indexer
        run: |
          ../scripts/shell/extract-python-version.sh
          echo "Got PYTHON_VERSION=${PYTHON_VERSION}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: ./doc_indexer
        run: poetry install --with test

      - name: Run integration tests
        working-directory: ./doc_indexer
        env:
          LOG_LEVEL: "DEBUG"
          DOCS_SOURCES_FILE_PATH: "./docs_sources.json"
          DOCS_PATH: "/test-data"
          DOCS_TABLE_NAME: "kc_pr_${{ github.event.pull_request.number }}"
          DOC_INDEXER_TESTS_CONFIG: ${{ secrets.DOC_INDEXER_TESTS_CONFIG }}
        run: |
          export CONFIG_PATH=$GITHUB_WORKSPACE/config/config.json
          echo "$DOC_INDEXER_TESTS_CONFIG" > "$CONFIG_PATH"
          poetry run poe test-integration
