name: "Update evaluation baseline"
run-name: "Update evaluation baseline (PR-#${{ github.event.number }})"

on:
  pull_request_target:
    types: [closed]
    branches: [main]

# Best-effort: this workflow must never block other checks.
# - contents: read  -> checkout main.
# - actions: read   -> list/download the metrics artifact produced by the PR's
#                      (separate) evaluation run via the Actions REST API, and read
#                      that run to check which workflow produced the artifact.
# The bot PR itself is created with a GitHub App token (see create-release.yml),
# not GITHUB_TOKEN, so no write permission is needed here.
permissions:
  contents: read
  actions: read

jobs:
  update-baseline:
    name: Open baseline-update PR
    # Only for merged PRs that carried the evaluation label.
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'evaluation requested')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          # Don't persist GITHUB_TOKEN creds; the bot PR pushes with the App token (set-url below).
          persist-credentials: false

      - name: Download metrics artifact from the PR's evaluation run
        id: fetch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          # The merged PR's last commit. The evaluation must have run on exactly this commit.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
          # The only workflow whose metrics are accepted, and the event it runs on.
          # pull_request_target always uses the workflow file of the base branch, so a
          # workflow changed or added by a PR cannot produce a matching run.
          EVAL_WORKFLOW_PATH: ".github/workflows/pull-evaluation-tests.yaml"
          EVAL_WORKFLOW_EVENT: "pull_request_target"
          # Upper bound for the artifact and for metrics.json (the baseline is ~200 KB).
          MAX_BYTES: 5242880
        run: |
          set -euo pipefail
          NAME="evaluation-metrics-PR-${PR_NUMBER}"
          echo "found=false" >> "$GITHUB_OUTPUT"

          # Any workflow run in the repository can upload an artifact with this name, so
          # the name alone proves nothing. Only artifacts whose producing run belongs to
          # this repository and ran for the PR's head commit are candidates; newest first.
          CANDIDATES="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${NAME}&per_page=100" \
            | jq -r '.artifacts[]
              | select(.expired == false)
              | select(.workflow_run.head_sha == env.PR_HEAD_SHA)
              | select((.workflow_run.repository_id | tostring) == env.REPOSITORY_ID)
              | select(.size_in_bytes <= (env.MAX_BYTES | tonumber))
              | [.created_at, .id, .workflow_run.id] | @tsv' | sort -r)"

          # Presence of the artifact encodes "the evaluation run passed" (it is only
          # uploaded when the evaluation step succeeded). Take the newest candidate whose
          # run is a run of the evaluation workflow.
          ART_ID=""
          while IFS=$'\t' read -r _ id run_id; do
            [ -n "${id}" ] || continue
            RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            if echo "$RUN" | jq -e '
                (.path | split("@")[0]) == env.EVAL_WORKFLOW_PATH
                and .event == env.EVAL_WORKFLOW_EVENT
                and .head_sha == env.PR_HEAD_SHA
                and (.repository.id | tostring) == env.REPOSITORY_ID' > /dev/null; then
              ART_ID="${id}"
              echo "Using artifact ${id} of run ${run_id}."
              break
            fi
            echo "::warning::Ignoring artifact ${id}: run ${run_id} is not an evaluation run of this PR."
          done <<< "$CANDIDATES"

          if [ -z "$ART_ID" ]; then
            echo "::warning::No ${NAME} artifact of an evaluation run on ${PR_HEAD_SHA} found - nothing to update."
            exit 0
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART_ID}/zip" > metrics.zip

          # Look at the archive before reading anything from it: it must contain exactly
          # one entry, the regular file metrics.json (no directory, symlink, absolute or
          # ../ path, no second file).
          ENTRIES="$(unzip -Z1 metrics.zip)"
          if [ "$ENTRIES" != "metrics.json" ]; then
            echo "::warning::Unexpected content in artifact ${ART_ID} - nothing to update."
            exit 0
          fi
          if [ "$(unzip -Z -s metrics.zip metrics.json | cut -c1)" != "-" ]; then
            echo "::warning::metrics.json in artifact ${ART_ID} is not a regular file - nothing to update."
            exit 0
          fi

          # Write the content to a new file instead of unpacking the archive, and stop
          # reading at the size limit, whatever size the archive declares.
          rm -rf _metrics
          mkdir _metrics
          unzip -p metrics.zip metrics.json | head -c "$((MAX_BYTES + 1))" > _metrics/metrics.json || true
          if [ "$(wc -c < _metrics/metrics.json)" -gt "$MAX_BYTES" ]; then
            echo "::warning::metrics.json in artifact ${ART_ID} is larger than ${MAX_BYTES} bytes - nothing to update."
            exit 0
          fi

          # Exactly one JSON document with the same top-level shape as
          # tests/blackbox/baseline_metrics.json. --slurp, because `jq -e` alone only
          # looks at the last document of a file that contains several.
          if ! jq -e --slurp '
              length == 1
              and (.[0] | type == "object"
                and (.summary | type == "object")
                and (.scenarios | type == "array")
                and (.run | type == "object"))' _metrics/metrics.json > /dev/null; then
            echo "::warning::metrics.json in artifact ${ART_ID} is not a valid metrics report - nothing to update."
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        if: steps.fetch.outputs.found == 'true'
        uses: actions/create-github-app-token@v3
        with:
          # Reuse the same GitHub App configuration as create-release.yml.
          app-id: ${{ vars.AIFORCE_APP_ID }}
          private-key: ${{ secrets.AIFORCE_APP_PRIVATE_KEY }}

      - name: Resolve GitHub App bot identity
        id: bot-identity
        if: steps.fetch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Create bot PR
        if: steps.fetch.outputs.found == 'true'
        continue-on-error: true
        env:
          # Reuse the repo's established bot-PR pattern (create-release.yml): a GitHub App
          # token, NOT GITHUB_TOKEN (which is deliberately avoided in this repo).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_NAME: ${{ steps.bot-identity.outputs.name }}
          GIT_EMAIL: ${{ steps.bot-identity.outputs.email }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          # Always open a PR (--allow-empty); the codeowner decides whether to adopt it.
          cp _metrics/metrics.json tests/blackbox/baseline_metrics.json
          BRANCH="chore/update-eval-baseline-PR-${PR_NUMBER}"
          git config user.name "${GIT_NAME}"
          git config user.email "${GIT_EMAIL}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Fetch any existing bot branch into its remote-tracking ref so --force-with-lease
          # has something to compare against on re-runs (main-only checkout has none).
          git fetch origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" || true
          git checkout -b "$BRANCH"
          git add tests/blackbox/baseline_metrics.json
          git commit --allow-empty -m "chore: update evaluation baseline metrics (from #${PR_NUMBER})"
          git push --force-with-lease origin "$BRANCH"
          # The label may already exist; ignore the failure in that case.
          gh label create baseline-update --color BFD4F2 \
            --description "Automated evaluation baseline refresh" 2>/dev/null || true
          # Reuse an existing open bot PR for this source PR instead of creating a duplicate.
          if gh pr view "$BRANCH" --json state --jq '.state' 2>/dev/null | grep -q OPEN; then
            echo "PR for ${BRANCH} already open - branch updated, nothing else to do."
            exit 0
          fi
          gh pr create \
            --base main --head "$BRANCH" \
            --title "chore: update evaluation baseline metrics (from #${PR_NUMBER})" \
            --label baseline-update \
            --body "$(cat <<EOF
          Automated refresh of \`tests/blackbox/baseline_metrics.json\` from the evaluation run of #${PR_NUMBER}.

          - Source PR: #${PR_NUMBER}
          - Dashboard: see the **📊 Evaluation Report** link in that PR's run summary.

          _Opened automatically. Not auto-merged — review before merging._
          EOF
          )"
