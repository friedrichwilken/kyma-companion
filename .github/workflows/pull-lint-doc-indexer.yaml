name: pull-lint-doc-indexer

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - "main"
      - "release-**"
    paths:
      - "doc_indexer/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Python version
        id: python-version
        working-directory: ./doc_indexer
        run: |
          ../scripts/shell/extract-python-version.sh
          echo "Got PYTHON_VERSION=${PYTHON_VERSION}"

      - name: Setup Python and Poetry
        uses: kyma-project/kyma-companion/.github/actions/setup-poetry@main
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache-dependency-path: doc_indexer/poetry.lock

      - name: Install dependencies
        working-directory: ./doc_indexer
        run: poetry install --with test

      - name: Run lint
        working-directory: ./doc_indexer
        run: |
          ls
          poetry run poe codecheck
