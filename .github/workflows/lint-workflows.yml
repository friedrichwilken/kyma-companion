name: Lint GitHub Actions workflows

on:
  pull_request:
    branches:
      - "main"
      - "release-**"
    paths:
      - ".github/workflows/**"

jobs:
  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
